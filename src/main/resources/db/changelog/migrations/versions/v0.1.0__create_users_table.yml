databaseChangeLog:

  - changeSet:
      id: v0.1.0-create-users-table
      author: dev
      comment: "Crea la tabla de usuarios con UUID y password hasheado"
      changes:

        - createTable:
            tableName: users
            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false


        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_users_active
            tableName: users
            columns:
              - column:
                  name: active

      rollback:
        - dropTable:
            tableName: users
